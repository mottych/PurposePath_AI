components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
    Page:
      in: query
      name: page
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    TenantId:
      in: path
      name: tenantId
      required: true
      schema:
        type: string
        format: uuid
    PlanId:
      in: path
      name: planId
      required: true
      schema:
        type: string
        format: uuid
    FeatureSetId:
      in: path
      name: featureSetId
      required: true
      schema:
        type: string
        format: uuid
    ScheduleId:
      in: path
      name: scheduleId
      required: true
      schema:
        type: string
        format: uuid
    ExtensionDefinitionId:
      in: path
      name: extensionDefinitionId
      required: true
      schema:
        type: string
        format: uuid
    PriceTierId:
      in: path
      name: priceTierId
      required: true
      schema:
        type: string
        format: uuid
    DiscountCodeId:
      in: path
      name: discountCodeId
      required: true
      schema:
        type: string
        format: uuid
    OverrideId:
      in: path
      name: overrideId
      required: true
      schema:
        type: string
        format: uuid
    PaymentId:
      in: path
      name: paymentId
      required: true
      schema:
        type: string
        format: uuid
    ExtensionSelectionId:
      in: path
      name: extensionSelectionId
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BillingValidationConflict:
      description: >-
        The request conflicts with the current billing state, a uniqueness invariant, or
        an existing effective-dated record.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiResponseBase"
          examples:
            designationConflict:
              value:
                success: false
                message: Validation conflict
                error:
                  code: BILLING_PLAN_DESIGNATION_CONFLICT
                  message: Another plan is already designated for this lifecycle role.
                  correlationId: 2fd3a229-a8bc-4ae1-8435-a8b7fcbac0c1
                  details:
                    category: conflict
                    conflicts:
                      - code: duplicateDesignation
                        resourceType: planDesignation
                        resourceId: 1ab2c3d4-1111-2222-3333-444455556666
                        field: designationType
                        message: Trial designation already exists.
            effectiveDateOverlap:
              value:
                success: false
                message: Validation conflict
                error:
                  code: BILLING_EFFECTIVE_DATE_OVERLAP
                  message: The requested effective period overlaps an existing billing record.
                  correlationId: 5fc6eb60-f2c8-4706-9c1b-1f8050d52011
                  details:
                    category: conflict
                    conflicts:
                      - code: overlappingEffectiveWindow
                        field: effectiveStartDateUtc
                        existingRange:
                          start: 2025-01-01T00:00:00Z
                          end: 2025-12-31T23:59:59Z
                        requestedRange:
                          start: 2025-06-01T00:00:00Z
                          end: null
    BillingValidationFailure:
      description: >-
        The request is syntactically valid but fails billing-specific validation rules.
        The error wrapper is unchanged; diagnostics are carried in `error.details.validationErrors`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiResponseBase"
          examples:
            hiddenPlanAssignmentFailure:
              value:
                success: false
                message: Validation failed
                error:
                  code: BILLING_VALIDATION_FAILED
                  message: One or more billing validation rules were not satisfied.
                  correlationId: 5344d8aa-f0c6-4230-91ce-26ab3f6bb512
                  details:
                    category: validation
                    validationErrors:
                      - field: planId
                        code: hiddenPlanRequired
                        message: The selected plan must remain hidden for this admin-only assignment endpoint.
                      - field: reason
                        code: required
                        message: Reason is required when bypassing the catalog.
            nonAdditiveOverride:
              value:
                success: false
                message: Validation failed
                error:
                  code: BILLING_OVERRIDE_NOT_ADDITIVE
                  message: Tenant overrides may only add to the base entitlement.
                  correlationId: a6f97f2e-4173-44d6-a0b4-09dd87d4f83a
                  details:
                    category: validation
                    validationErrors:
                      - field: numericValue
                        code: nonAdditiveValue
                        message: Override cannot reduce the base limit.

