openapi: 3.0.3
info:
  title: PurposePath Billing Backend Redesign API
  version: 1.1.0
  description: >-
    Backend contract draft for plans, subscriptions, billing, entitlements,
    admin catalog management, pricing controls, and provider webhooks.
servers:
  - url: https://api.dev.purposepath.app
    description: Shared API host
tags:
  - name: owner-billing
    description: Tenant-owner billing and subscription management endpoints.
  - name: admin-billing
    description: Admin billing catalog, pricing, override, audit, and settings endpoints.
  - name: provider-webhooks
    description: Billing-provider webhook ingress endpoints.
paths:
  /account/api/v1/billing/subscription/current:
    get:
      tags: [owner-billing]
      summary: Get current tenant subscription billing view
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Subscription view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseSubscriptionCurrent"

  /account/api/v1/billing/plans/catalog:
    get:
      tags: [owner-billing]
      summary: Get published billing catalog
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: includeCurrentPlan
          schema:
            type: boolean
        - in: query
          name: schedule
          schema:
            type: string
      responses:
        "200":
          description: Catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePlanCatalog"

  /account/api/v1/billing/subscription/preview-change:
    post:
      tags: [owner-billing]
      summary: Preview subscription change with proration and validation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewSubscriptionChangeRequest"
      responses:
        "200":
          description: Change preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseSubscriptionChangePreview"

  /account/api/v1/billing/subscription/confirm-change:
    post:
      tags: [owner-billing]
      summary: Confirm subscription change
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmSubscriptionChangeRequest"
      responses:
        "200":
          description: Change result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseSubscriptionChangeResult"

  /account/api/v1/billing/subscription/cancel:
    post:
      tags: [owner-billing]
      summary: Cancel auto-renewal
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelSubscriptionRequest"
      responses:
        "200":
          description: Updated subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseSubscriptionCurrent"

  /account/api/v1/billing/subscription/reactivate:
    post:
      tags: [owner-billing]
      summary: Reactivate subscription auto-renew or recover during grace
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReactivateSubscriptionRequest"
      responses:
        "200":
          description: Updated subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseSubscriptionCurrent"

  /account/api/v1/billing/subscription/extensions:
    get:
      tags: [owner-billing]
      summary: Get subscription extensions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Extension state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseExtensionState"
    post:
      tags: [owner-billing]
      summary: Upsert extension selections
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertExtensionsRequest"
      responses:
        "200":
          description: Updated extensions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseExtensionMutationResult"

  /account/api/v1/billing/subscription/extensions/{extensionSelectionId}:
    delete:
      tags: [owner-billing]
      summary: Schedule extension removal
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ExtensionSelectionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Removal scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseExtensionRemovalResult"

  /account/api/v1/billing/payment-method:
    get:
      tags: [owner-billing]
      summary: Get masked payment method
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Payment method
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePaymentMethod"

  /account/api/v1/billing/payment-method/setup-intent:
    post:
      tags: [owner-billing]
      summary: Create provider setup intent or setup session
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Setup payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseSetupIntent"

  /account/api/v1/billing/payment-method/confirm:
    post:
      tags: [owner-billing]
      summary: Confirm payment method update
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmPaymentMethodRequest"
      responses:
        "200":
          description: Updated payment method
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePaymentMethod"

  /account/api/v1/billing/payment-history:
    get:
      tags: [owner-billing]
      summary: Get payment history
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Payment history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePaymentHistory"

  /account/api/v1/billing/payment-history/{paymentId}/receipt:
    get:
      tags: [owner-billing]
      summary: Get receipt download metadata
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PaymentId"
      responses:
        "200":
          description: Receipt metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseReceipt"

  /account/api/v1/billing/audit:
    get:
      tags: [owner-billing]
      summary: Get tenant-visible billing audit history
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - in: query
          name: eventType
          schema:
            type: string
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseBillingAuditList"

  /account/api/v1/billing/entitlements/effective:
    get:
      tags: [owner-billing]
      summary: Get effective feature and limit entitlements
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Entitlement snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseEntitlements"

  /admin/api/v1/billing/feature-catalog:
    get:
      tags: [admin-billing]
      summary: Get canonical feature metadata catalog
      description: >-
        Returns the canonical registry of feature keys, value types, allowed ranges,
        tier options, and override constraints used to build and validate feature sets,
        plans, extensions, and tenant overrides.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Feature catalog metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseFeatureCatalog"

  /admin/api/v1/billing/feature-sets:
    get:
      tags: [admin-billing]
      summary: List feature sets
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/ResourceStatus"
        - in: query
          name: includeArchived
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Feature sets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseFeatureSetList"
    post:
      tags: [admin-billing]
      summary: Create feature set
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFeatureSetRequest"
      responses:
        "201":
          description: Feature set created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseFeatureSet"
        "422":
          $ref: "#/components/responses/BillingValidationFailure"

  /admin/api/v1/billing/feature-sets/{featureSetId}:
    get:
      tags: [admin-billing]
      summary: Get feature set
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FeatureSetId"
      responses:
        "200":
          description: Feature set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseFeatureSet"
    patch:
      tags: [admin-billing]
      summary: Update feature set
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FeatureSetId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFeatureSetRequest"
      responses:
        "200":
          description: Feature set updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseFeatureSet"
        "422":
          $ref: "#/components/responses/BillingValidationFailure"
    delete:
      tags: [admin-billing]
      summary: Delete feature set
      description: Hard delete is allowed only when the feature set is not referenced by any plan.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FeatureSetId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Feature set deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseMutationAccepted"

  /admin/api/v1/billing/feature-sets/{featureSetId}/deactivate:
    post:
      tags: [admin-billing]
      summary: Deactivate feature set
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FeatureSetId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Feature set deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseFeatureSet"

  /admin/api/v1/billing/feature-sets/{featureSetId}/activate:
    post:
      tags: [admin-billing]
      summary: Activate feature set
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FeatureSetId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Feature set activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseFeatureSet"

  /admin/api/v1/billing/plans:
    get:
      tags: [admin-billing]
      summary: List plans
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: visibility
          schema:
            $ref: "#/components/schemas/PlanVisibility"
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/ResourceStatus"
        - in: query
          name: includeArchived
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Plans
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePlanList"
    post:
      tags: [admin-billing]
      summary: Create plan
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlanRequest"
      responses:
        "201":
          description: Plan created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePlan"
        "422":
          $ref: "#/components/responses/BillingValidationFailure"

  /admin/api/v1/billing/plans/{planId}:
    get:
      tags: [admin-billing]
      summary: Get plan
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PlanId"
      responses:
        "200":
          description: Plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePlan"
    patch:
      tags: [admin-billing]
      summary: Update plan
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PlanId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlanRequest"
      responses:
        "200":
          description: Plan updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePlan"
        "422":
          $ref: "#/components/responses/BillingValidationFailure"
    delete:
      tags: [admin-billing]
      summary: Delete plan
      description: Hard delete is allowed only before a plan has ever been subscribed.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PlanId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Plan deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseMutationAccepted"

  /admin/api/v1/billing/plans/{planId}/archive:
    post:
      tags: [admin-billing]
      summary: Archive plan
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PlanId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Plan archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePlan"

  /admin/api/v1/billing/plans/{planId}/restore:
    post:
      tags: [admin-billing]
      summary: Restore archived plan
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PlanId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Plan restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePlan"

  /admin/api/v1/billing/plans/{planId}/publish:
    post:
      tags: [admin-billing]
      summary: Publish plan
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PlanId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Plan published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePlan"

  /admin/api/v1/billing/plans/{planId}/hide:
    post:
      tags: [admin-billing]
      summary: Hide plan from self-service catalog
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PlanId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Plan hidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePlan"

  /admin/api/v1/billing/plans/{planId}/set-trial:
    post:
      tags: [admin-billing]
      summary: Designate plan as the single active trial plan
      description: >-
        Replaces any existing trial designation. Validation fails if the plan is not
        eligible for trial use.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PlanId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Trial designation applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePlanDesignation"
        "409":
          $ref: "#/components/responses/BillingValidationConflict"
        "422":
          $ref: "#/components/responses/BillingValidationFailure"

  /admin/api/v1/billing/plans/trial-designation:
    delete:
      tags: [admin-billing]
      summary: Remove current trial plan designation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Trial designation cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePlanDesignation"

  /admin/api/v1/billing/plans/{planId}/set-fallback:
    post:
      tags: [admin-billing]
      summary: Designate plan as the single active fallback plan
      description: >-
        Replaces any existing fallback designation. Validation fails if the plan is not
        eligible for fallback use.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PlanId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Fallback designation applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePlanDesignation"
        "409":
          $ref: "#/components/responses/BillingValidationConflict"
        "422":
          $ref: "#/components/responses/BillingValidationFailure"

  /admin/api/v1/billing/plans/fallback-designation:
    delete:
      tags: [admin-billing]
      summary: Remove current fallback plan designation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Fallback designation cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePlanDesignation"

  /admin/api/v1/billing/plans/{planId}/schedules/{scheduleId}/price:
    put:
      tags: [admin-billing]
      summary: Upsert effective-dated plan schedule price
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PlanId"
        - $ref: "#/components/parameters/ScheduleId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertPlanSchedulePriceRequest"
      responses:
        "200":
          description: Price updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePlan"
        "409":
          $ref: "#/components/responses/BillingValidationConflict"
        "422":
          $ref: "#/components/responses/BillingValidationFailure"

  /admin/api/v1/billing/payment-schedules:
    get:
      tags: [admin-billing]
      summary: List payment schedules
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/ResourceStatus"
        - in: query
          name: includeArchived
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Schedules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePaymentScheduleList"
    post:
      tags: [admin-billing]
      summary: Create payment schedule
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentScheduleRequest"
      responses:
        "201":
          description: Schedule created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePaymentSchedule"

  /admin/api/v1/billing/payment-schedules/{scheduleId}:
    get:
      tags: [admin-billing]
      summary: Get payment schedule
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScheduleId"
      responses:
        "200":
          description: Schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePaymentSchedule"
    patch:
      tags: [admin-billing]
      summary: Update payment schedule
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScheduleId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePaymentScheduleRequest"
      responses:
        "200":
          description: Schedule updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePaymentSchedule"
    delete:
      tags: [admin-billing]
      summary: Delete payment schedule
      description: Hard delete is allowed only when the schedule is unused.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScheduleId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Schedule deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseMutationAccepted"

  /admin/api/v1/billing/payment-schedules/{scheduleId}/deactivate:
    post:
      tags: [admin-billing]
      summary: Deactivate payment schedule
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScheduleId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Schedule deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePaymentSchedule"

  /admin/api/v1/billing/payment-schedules/{scheduleId}/activate:
    post:
      tags: [admin-billing]
      summary: Activate payment schedule
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScheduleId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Schedule activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePaymentSchedule"

  /admin/api/v1/billing/extensions:
    get:
      tags: [admin-billing]
      summary: List extension definitions
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: planId
          schema:
            type: string
            format: uuid
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/ResourceStatus"
        - in: query
          name: includeArchived
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Extensions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseExtensionDefinitionList"
    post:
      tags: [admin-billing]
      summary: Create extension definition
      security:
        - bearerAuth: []
      parameters:
