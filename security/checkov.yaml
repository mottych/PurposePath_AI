framework:
  - cloudformation
  - github_actions
  - secrets

quiet: true
compact: true
# IaC posture is tracked in reports; do not block CI until checks are remediated or scoped.
soft-fail: true

skip-path:
  - .venv
  - .venv-security
  - .pytest_cache
  - .mypy_cache
  - .ruff_cache
  - node_modules
  - docs
  - coaching/tests
  - tests
