name: IssueFlow Label Sync

on:
  workflow_dispatch:
  push:
    paths:
      - ".issueflow/repo.yaml"
      - ".issueflow/agents/**"
      - ".github/workflows/issueflow-labels.yml"

permissions:
  contents: read
  issues: write

jobs:
  sync-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure current IssueFlow labels exist
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              ["IssueFlow", "1D76DB", "Trigger IssueFlow triage for this issue"],
              ["bug", "D73A4A", "IssueFlow workflow type: bug"],
              ["enhancement", "A2EEEF", "IssueFlow workflow type: enhancement"],
              ["feature", "7057FF", "IssueFlow workflow type: feature"],
              ["if-status:ready", "0E8A16", "IssueFlow status: ready"],
              ["if-status:in-progress", "FBCA04", "IssueFlow status: in progress"],
              ["if-status:waiting", "D93F0B", "IssueFlow status: waiting"],
              ["if-status:done", "C2E0C6", "IssueFlow status: done"],
              ["if-outcome:passed", "0E8A16", "IssueFlow outcome: passed"],
              ["if-outcome:failed", "B60205", "IssueFlow outcome: failed"],
              ["if-outcome:needs-info", "D93F0B", "IssueFlow outcome: needs info"],
              ["if-outcome:blocked", "B60205", "IssueFlow outcome: blocked"],
              ["human-pending", "F9D0C4", "IssueFlow is waiting for human input"],
              ["aborted", "000000", "IssueFlow work was aborted"],
              ["hotfix", "D93F0B", "Marks issue for production-lane handling"],
              ["type:lesson", "5319E7", "IssueFlow lesson proposal"],
              ...[
                "triage", "suggestion", "requirement", "design", "human-gate-1",
                "implementation", "epic-creation", "sub-issues", "validation",
                "deploy", "deployment", "e2e", "qa", "cleanup"
              ].map((stage) => [`if-stage:${stage}`, "1D76DB", `IssueFlow stage: ${stage}`])
            ].map(([name, color, description]) => ({ name, color, description }));

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const existing = await github.paginate(github.rest.issues.listLabelsForRepo, {
              owner,
              repo,
              per_page: 100
            });
            const existingByName = new Map(existing.map((label) => [label.name.toLowerCase(), label]));
            let created = 0;
            let updated = 0;
            let unchanged = 0;

            for (const label of labels) {
              const match = existingByName.get(label.name.toLowerCase());
              if (!match) {
                await github.rest.issues.createLabel({ owner, repo, ...label });
                created += 1;
                continue;
              }
              if ((match.color || "").toLowerCase() !== label.color.toLowerCase() || (match.description || "") !== label.description || match.name !== label.name) {
                await github.rest.issues.updateLabel({ owner, repo, name: match.name, new_name: label.name, color: label.color, description: label.description });
                updated += 1;
              } else {
                unchanged += 1;
              }
            }

            await core.summary
              .addHeading("IssueFlow Label Sync")
              .addRaw(`Created: ${created}\n`)
              .addRaw(`Updated: ${updated}\n`)
              .addRaw(`Unchanged: ${unchanged}\n`)
              .write();
