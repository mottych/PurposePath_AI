workflows:
  bug:
    stages:
      - name: triage
        kind: worker
        agent: joseph
        routes: { passed: next, failed: same, needs-info: wait, blocked: wait-blocked }
      - name: design
        kind: worker
        agent: bezzalel
        interactive: true
        routes: { passed: next, failed: same, needs-info: wait, blocked: wait-blocked }
      - name: human-gate-1
        kind: human
        routes: { passed: next, failed: design, needs-info: wait, blocked: wait-blocked }
      - name: implementation
        kind: worker
        agent: joshua
        interactive: true
        maxAttempts: 5
        routes: { passed: next, failed: same, needs-info: wait, blocked: wait-blocked }
      - name: validation
        kind: worker
        agent: validator
        recoveryStage: true
        routes: { passed: next, failed: implementation, needs-info: wait, blocked: wait-blocked }
      - name: deploy
        kind: worker
        agent: deployer
        recoveryStage: true
        recoverableNeedsInfo: true
        routes: { passed: next, failed: implementation, needs-info: implementation, blocked: wait-blocked }
      - name: e2e
        kind: worker
        agent: e2e
        recoveryStage: true
        recoverableNeedsInfo: true
        routes: { passed: next, failed: implementation, needs-info: implementation, blocked: wait-blocked }
      - name: qa
        kind: worker
        agent: qa
        recoveryStage: true
        routes: { passed: next, failed: implementation, needs-info: wait, blocked: wait-blocked }
      - name: production-deploy
        kind: worker
        agent: deployer
        recoveryStage: true
        recoverableNeedsInfo: true
        routes: { passed: next, failed: implementation, needs-info: implementation, blocked: wait-blocked }
      - name: merge-down
        kind: worker
        agent: deployer
        recoveryStage: true
        routes: { passed: next, failed: implementation, needs-info: wait, blocked: wait-blocked }
      - name: cleanup
        kind: worker
        agent: cleanup
        routes: { passed: done, failed: same, needs-info: wait, blocked: wait-blocked }
    deploymentRoutes:
      dev:
        qa: cleanup
      hotfix:
        deploy: e2e
        deployment: e2e
        qa: production-deploy
        production-deploy: merge-down
        merge-down: cleanup
