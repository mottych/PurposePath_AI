name: human-gate-1
stage: human-gate-1
role: human
kind: human
issueTypes:
- bug
- enhancement
- feature
interactive: false
staleRetryLimit: 3
routes:
  passed:
    default: implementation
    when:
    - issueType: feature
      target: epic-creation
  failed:
    default: design
  needs-info:
    default: wait
  blocked:
    default: wait-blocked
promptPath: prompt.md
