name: deployment
stage: deployment
role: deployer
kind: worker
issueTypes:
- feature
interactive: false
staleRetryLimit: 3
routes:
  passed:
    default: e2e
  failed:
    default: implementation
    when:
    - labels:
      - requires_design_change
      target: design
  needs-info:
    default: implementation
  blocked:
    default: wait-blocked
execution:
  backend: opencode
  openCodeAgent: build
openCodeAgent: build
charterPath: charter.md
promptPath: prompt.md
permissionsPath: permissions.yaml
