name: implementation
stage: implementation
role: joshua
kind: worker
issueTypes:
- bug
- enhancement
interactive: true
staleRetryLimit: 3
routes:
  passed:
    default: validation
  failed:
    default: same
  needs-info:
    default: wait
  blocked:
    default: wait-blocked
execution:
  backend: opencode
  openCodeAgent: build
openCodeAgent: build
maxAttempts: 5
charterPath: charter.md
promptPath: prompt.md
permissionsPath: permissions.yaml
