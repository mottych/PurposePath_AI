name: design
stage: design
role: bezzalel
kind: worker
issueTypes:
- bug
- enhancement
- feature
interactive: true
staleRetryLimit: 3
routes:
  passed:
    default: human-gate-1
  failed:
    default: same
  needs-info:
    default: wait
  blocked:
    default: wait-blocked
execution:
  backend: opencode
  openCodeAgent: build
openCodeAgent: build
charterPath: charter.md
promptPath: prompt.md
permissionsPath: permissions.yaml
