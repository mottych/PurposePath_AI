name: validation
stage: validation
role: validator
kind: worker
issueTypes:
- bug
- enhancement
interactive: false
staleRetryLimit: 3
routes:
  passed:
    default: deploy
  failed:
    default: implementation
    when:
    - labels:
      - requires_design_change
      target: design
  needs-info:
    default: wait
  blocked:
    default: wait-blocked
execution:
  backend: opencode
  openCodeAgent: build
openCodeAgent: build
charterPath: charter.md
promptPath: prompt.md
permissionsPath: permissions.yaml
